<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18110b" />
  <title>Jilani Chicken Pakodi | Scan & Watch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="brand">
      <div class="badge">🔥 FRESH • HOT • CRISPY</div>
      <h1>జిలాని చికెన్ పకోడి</h1>
      <p class="tagline">స్పైసీ రుచితో... అసలైన చికెన్ పకోడి!</p>
    </section>

    <section class="video-card" aria-label="Chicken pakodi promo video">
      <div class="video-wrap">
        <video id="promoVideo" playsinline controls preload="auto" poster="poster.jpg">
          <source src="promo.mp4" type="video/mp4" />
          మీ బ్రౌజర్ వీడియోను ప్లే చేయలేకపోతోంది.
        </video>
        <button id="startButton" class="play-overlay" type="button" aria-label="Play video">
          <span class="play-icon">▶</span>
          <span>వీడియో చూడండి · Tap to Play</span>
        </button>
      </div>
      <p class="hint">వేడివేడిగా తయారయ్యే మా చికెన్ పకోడి కోసం కొద్దిసేపు వేచి ఉండండి 😋</p>
      <a id="instagramLink" class="instagram" href="https://www.instagram.com/jilani_chicken_pakodi/" target="_blank" rel="noopener" hidden>Instagramలో మమ్మల్ని Follow చేయండి</a>
    </section>
    <footer>Made with ❤️ for Jilani Chicken Pakodi</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
